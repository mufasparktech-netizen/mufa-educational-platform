//SHA
function sha256(s){const b=new TextEncoder().encode(s),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=128;const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8);const K=[],H=[];
for(let c=2,i=0;i<64;c++){let p=1;for(let d=2;d*d<=c;d++)if(c%d==0)p=0;if(p){if(i<8)H[i]=(Math.pow(c,.5)%1)*4294967296|0;K[i++]=(Math.cbrt(c)%1)*4294967296|0}}
const w=new Int32Array(64),R=(x,n)=>(x>>>n)|(x<<(32-n));
for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(R(a,7)^R(a,18)^(a>>>3))+w[i-7]+(R(c,17)^R(c,19)^(c>>>10)))|0}
let[a,b2,c2,d,e,f,g,h]=H;
for(let i=0;i<64;i++){const t1=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c2)^(b2&c2)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0}
[a,b2,c2,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)|0)}
return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

return `<div class=card><b>${esc(x.title)}</b> ${live(x)?'':'<span class=tag>awaiting likes</span>'}<p>${esc(x.body||'')}</p><p class=m>By ${x.admin?'Admin':esc(nm(x.by))} · ${x.likes.length}/6 likes</p>`+

:live(x)?`<hr>${rs.map(r=>rep(r,0)).join('')}<div class=row><input id=r-${x.id} placeholder="Type your reply"><button data-a=reply data-v=${x.id}>Send</button></div><button class=s data-a=rec data-v=${x.id} data-k=audio>Record audio</button><button class=s data-a=rec data-v=${x.id} data-k=video>Record video note</button>`

:`<div class=card><h3>Change developer key</h3><input id=ok type=password placeholder="Current key"><input id=nk type=password placeholder="New key (8+ characters)"><button data-a=chk>Change key</button></div><div class=card><h3>Data in this browser</h3><p class=m>${db.classes.length} classes, ${db.people.length} people, ${db.posts.length} posts, ${db.replies.length} replies</p><button data-a=exp>Export data (JSON)</button><button class="s bad" data-a=wipe>Wipe all data</button></div>`;

else if(a==='sendmsg'&&me){const t=g('cm');if(!t||!cw)return;db.chats.push({id:uid(),from:me.id,to:cw,text:t,ts:Date.now(),del:0});save();feed()}
else if(a==='delmsg'&&me){const m=db.chats.find(x=>x.id===v&&x.from===me.id);if(m){m.del=1;save();feed()}}
else if(a==='saveprof'&&me){me.bio=g('bio');save();toast('Profile saved')}
else if(a==='rec'&&me)record(v,b.dataset.k);
else if(adm){
if(a==='addc'){const n=g('cn');if(!n)return;db.classes.push({id:uid(),name:n,code:code(6),owner:dv?'dev':ses.id});done()}
else if(a==='cp'){const u=location.href.split('#')[0]+'#/join/'+v;try{await navigator.clipboard.writeText(u);toast('Join link copied')}catch(x){prompt('Copy this link',u)}}
else if(a==='delc'&&confirm('Delete this class and everything in it?')){const ids=db.posts.filter(x=>x.classId===v).map(x=>x.id);rmR(r=>ids.includes(r.postId));db.posts=db.posts.filter(x=>x.classId!==v);db.people=db.people.filter(x=>x.classId!==v);db.classes=db.classes.filter(x=>x.id!==v);done()}
else if(a==='wa'){const p=db.people.find(x=>x.id===v),c=db.classes.find(x=>x.id===p.classId);let n=(p.ph||'').replace(/\D/g,'');if(!n)return toast('Add a phone number first');if(n[0]==='0')n='263'+n.slice(1);const t=`Hello ${p.name}, welcome to MUFA NEXUS EDU HUB.\nYour name on the system: ${p.name}\nClass: ${c.name}\nClass code: ${c.code}\nYour personal code: ${p.code}\nJoin here: ${location.href.split('#')[0]}#/join/${c.code}`;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank')}
else if(a==='addp'){const n=g('pn-'+v);if(!n)return;db.people.push({id:uid(),classId:v,name:n,role:g('pr-'+v)||'student',ph:g('ph-'+v),code:code(6)});done()}
else if(a==='delp'&&confirm('Remove this person and their replies?')){rmR(r=>r.pid===v);db.people=db.people.filter(x=>x.id!==v);done()}
else if(a==='addpost'){const t=g('pt');if(!t||!cur)return;db.posts.push({id:uid(),classId:cur,title:t,body:g('pb'),by:null,admin:1,ok:1,likes:[],ts:Date.now()});done()}
else if(a==='ok'){db.posts.find(x=>x.id===v).ok=1;done()}
else if(a==='delpost'&&confirm('Delete this post and its replies?')){rmR(r=>r.postId===v);db.posts=db.posts.filter(x=>x.id!==v);done()}
else if(a==='delsel'){const ids=[...b.closest('.card').querySelectorAll('.ck:checked')].map(c=>c.value);if(!ids.length)return toast('Tick the replies to remove');rmR(r=>ids.includes(r.id));done()}
else if(a==='delall'&&confirm('Remove all replies on this post?')){rmR(r=>r.postId===v);done()}
else if(dv){
if(a==='adda'){const n=g('an'),k=g('ak');if(!n||k.length<8)return toast('Name and a key of 8+ characters');db.admins.push({id:uid(),name:n,hash:H(k)});done()}
else if(a==='dela'&&confirm('Revoke this admin?')){db.admins=db.admins.filter(x=>x.id!==v);done()}
else if(a==='chk'){if(H(g('ok'))!==db.devHash)return toast('Current key is wrong');if(g('nk').length<8)return toast('New key needs 8+ characters');db.devHash=H(g('nk'));save();toast('Key changed')}
else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));l.download='mufa-nexus-data.json';l.click()}
else if(a==='wipe'&&confirm('Wipe ALL data? This cannot be undone.')){indexedDB.deleteDatabase('mnxm');db={...fresh(),devHash:db.devHash};done()}}}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.a==='cur'){cur=t.value;panel()}else if(t.dataset.a==='photo'&&t.files[0]&&ses&&ses.k==='p'){const me=db.people.find(x=>x.id===ses.id);me.photo=await rs(t.files[0]);save();feed()}});
route();
</script></body></html>
